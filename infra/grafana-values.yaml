grafana:
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
    auth:
      disable_login_form: false
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/portfolio.json

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"