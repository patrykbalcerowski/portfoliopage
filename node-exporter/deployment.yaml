apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-demo
  template:
    metadata:
      labels:
        app: portfolio-demo
      annotations:
        deployed-at: "2026-06-02-v3"
    spec:
      containers:
      - name: app
        image: patrykoo/nextcloud-exporter
        env:
        - name: NEXTCLOUD_USER
          valueFrom:
            secretKeyRef:
              name: nextcloud-credentials
              key: username
        - name: NEXTCLOUD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nextcloud-credentials
              key: password
        - name: BASE_URL
          valueFrom:
            configMapKeyRef:
              name: nextcloud-config
              key: base_url
        ports:
        - containerPort: 8082