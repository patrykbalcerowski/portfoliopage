apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud-exporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/patrykbalcerowski/portfoliopage.git
    targetRevision: HEAD
    path: node-exporter
  
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true